server {
    listen 4173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para assets JS/CSS (mejora el tiempo de carga inicial)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Assets con hash en el nombre (generados por Vite): cache agresivo 1 año
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: cualquier ruta que no sea un archivo existente
    # sirve index.html para que React Router la maneje
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ocultar versión de Nginx en headers
    server_tokens off;
}
