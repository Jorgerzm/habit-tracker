spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:habittracker_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: testSecretKeyForHabitTrackerApp_OnlyForTests_AtLeast256Bits!!
    expiration-ms: 3600000
