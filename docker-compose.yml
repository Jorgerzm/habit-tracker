services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: habittracker-db
    environment:
      POSTGRES_DB:       habittracker
      POSTGRES_USER:     habittracker
      POSTGRES_PASSWORD: habittracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habittracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Spring Boot backend ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./habit-tracker-backend
      dockerfile: Dockerfile
    container_name: habittracker-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL:  jdbc:postgresql://postgres:5432/habittracker
      JWT_SECRET:    localDevSecretKey_ReplaceInProduction_NeedsToBeAtLeast64CharactersLong!!
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173
      PORT:          8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── React frontend (preview del build de producción) ───────────────────────
  frontend:
    build:
      context: ./habit-tracker-frontend
      dockerfile: Dockerfile
    container_name: habittracker-web
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: http://localhost:8080/api
    ports:
      - "4173:4173"

volumes:
  postgres_data:
